<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>印刷プレビュー - POP作成システム</title>

  <!-- 文字は PC に入っている Noto Sans JP（Windows 10/11 に標準搭載）を使う。Web フォントは読み込まない -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pop-styles.css">
  <!-- 印刷（PDFに保存）用の用紙・余白の設定 -->
  <link rel="stylesheet" href="css/print.css">

  <!-- PDF生成用ライブラリ（グローバル変数として使うので preview-app.js より前に同期読み込み） -->
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- 他のファイルは preview-app.js から import される -->
  <script type="module" src="js/preview/preview-app.js"></script>
</head>
<body class="preview-page">

  <!-- 赤い帯（戻る・題名・印刷）と白い帯（面付け・デザイン・集計）をまとめて上に固定する -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="index.html" class="btn-back">‹ リストに戻る</a>
        <h1 class="app-title">印刷プレビュー</h1>
      </div>
      <div class="header-tools">
        <!-- 旧方式（画像化して PDF を作る）。印刷方式で問題がなければ外す -->
        <button type="button" id="downloadPdfBtn" class="btn-back">PDFを直接ダウンロード（旧）</button>
        <button type="button" id="printBtn" class="btn-download">印刷・PDF保存</button>
      </div>
    </div>

    <div class="preview-toolbar">
      <div class="preview-toolbar__inner">
        <div class="preview-controls">
          <label class="control">
            <span class="control__label">面付け</span>
            <select id="modeSelect" class="select">
              <option value="mixed">1枚のA4にまとめる</option>
              <option value="separated">サイズごとに用紙を分ける</option>
            </select>
          </label>

          <label class="control">
            <span class="control__label">デザイン</span>
            <select id="themeSelect" class="select select--theme">
              <option value="">読み込み中…</option>
            </select>
          </label>
        </div>
        <div id="statusInfo" class="status-info" role="status"></div>

        <!-- 選んだデザインでコメントが表示されない商品（preview-app.js の renderCommentAlert）。クリックで一覧を開く -->
        <details id="commentAlert" class="comment-alert hidden">
          <summary id="commentAlertSummary" class="comment-alert__summary"></summary>
          <ul id="commentAlertList" class="comment-alert__list"></ul>
        </details>
      </div>
    </div>
  </header>

  <main class="preview-main">
    <div id="pdfRenderArea"></div>
  </main>

  <!-- 通知（画面左下。スキャン画面と同じ形） -->
  <div id="previewNotice" class="toast hidden" role="status" aria-live="polite">
    <span class="toast__body">
      <span id="previewNoticeText" class="toast__text"></span>
    </span>
  </div>

</body>
</html>
