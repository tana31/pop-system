<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POP A4面付けPDFプレビュー</title>

  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pop-styles.css">

  <!-- PDF生成用ライブラリ（グローバル変数として使うので preview-app.js より前に同期読み込み） -->
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- 他のファイルは preview-app.js から import される -->
  <script type="module" src="js/preview/preview-app.js"></script>
</head>
<body class="preview-page">

  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="index.html" class="btn-back">← スキャン画面に戻る</a>
        <h1 class="app-title"><span>📄</span> A4面付けPDFプレビュー</h1>
      </div>

      <div class="preview-controls">
        <label class="control">
          <span class="control__label">面付けモード:</span>
          <select id="modeSelect" class="select select--bold">
            <option value="mixed">1枚のA4に混載して節約 (自動面付け)</option>
            <option value="separated">規格ごとに用紙を分ける</option>
          </select>
        </label>

        <label class="control">
          <span class="control__label">デザイン:</span>
          <select id="themeSelect" class="select select--theme">
            <option value="">読み込み中...</option>
          </select>
        </label>

        <button type="button" id="downloadPdfBtn" class="btn-download">⬇️ A4-PDFファイルを直接ダウンロード</button>
      </div>
    </div>
  </header>

  <main class="preview-main">
    <div id="statusInfo" class="status-info"></div>
    <div id="pdfRenderArea"></div>
  </main>

</body>
</html>
