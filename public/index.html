<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POP作成システム</title>

  <link rel="stylesheet" href="css/app.css">

  <!-- 他のファイルは scan-app.js から import されるので、ここに書くのはこれだけ -->
  <script type="module" src="js/scan/scan-app.js"></script>
</head>
<body class="scan-page">

  <header class="app-header">
    <div class="header-inner">
      <h1 class="app-title">POP作成システム</h1>
      <div class="header-tools">
        <label class="store-field" for="storeInput">
          <span>店舗番号</span>
          <input type="text" id="storeInput" class="store-input" inputmode="numeric" placeholder="未設定" autocomplete="off">
        </label>
        <div id="masterStatus" class="status-badge status-badge--loading">
          <span class="spin">⏳</span> マスタ読み込み中...
        </div>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- STEP 1: JANスキャン / あいまい検索 -->
    <section class="panel panel--primary">
      <div class="input-grid">
        <div>
          <label class="field-label field-label--primary" for="janInput">⚡ JANコード</label>
          <input type="text" id="janInput" class="jan-input" placeholder="バーコードをスキャン または 入力" autocomplete="off" disabled>
        </div>

        <div class="search-box">
          <label class="field-label" for="searchNameInput">🔍 商品検索</label>
          <input type="text" id="searchNameInput" class="search-input" placeholder="" autocomplete="off" disabled>
          <div id="searchSuggestions" class="suggestions hidden"></div>
        </div>
      </div>
    </section>

    <!-- STEP 2: 印刷待機リスト -->
    <section class="panel">
      <div class="list-header">
        <h2 class="list-title">
          <span>📋 印刷待機リスト</span>
          <span id="queueCount" class="count-badge">0件</span>
        </h2>
        <div class="toolbar">
          <button type="button" id="toggleAllOptionsBtn" class="btn-secondary">⚙️ 全行のオプションサイズ表示切替</button>
          <button type="button" id="clearQueueBtn" class="link-danger">リストを全クリア</button>
        </div>
      </div>

      <!-- スキャン通知バナー -->
      <div id="scanNotice" class="notice notice--success hidden">
        <span id="scanNoticeText"></span>
        <span id="scanNoticeSub" class="notice__sub">リスト先頭に追加しました</span>
      </div>

      <div id="queueListContainer" class="queue-list">
        <div id="emptyQueueMessage" class="empty-message">
          JANコードをスキャンすると、ここに商品が追加されます。
        </div>
      </div>

      <div class="actions">
        <button type="button" id="generatePopBtn" class="btn-primary">🖨️ 印刷プレビュー・PDF出力画面へ進む</button>
      </div>
    </section>

  </main>

</body>
</html>
